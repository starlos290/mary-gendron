<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#fff9ed">
  <title>Test kit download | HR Fieldwork</title>
  <link rel="icon" type="image/svg+xml" href="/hr-kits/assets/brand/favicon.svg">
  <link rel="stylesheet" href="/hr-kits/assets/site.css">
  <link rel="stylesheet" href="/checkout/checkout.css">
  <script defer src="/checkout/checkout.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to the download</a>
  <header class="masthead"><div class="wrap mast-inner">
    <a class="brand-home" href="/" aria-label="HR Fieldwork home"><img src="/hr-kits/assets/brand/hr-fieldwork.svg" width="208" height="33" alt="HR Fieldwork"></a>
    <span class="environment">Checkout preview</span>
  </div></header>
  <main id="main" class="checkout-wrap checkout-return">
    <section class="checkout-intro" aria-labelledby="title">
      <h1 id="title">Test kit download.</h1>
      <p id="session-status">Open this page from a completed test checkout to download the sample ZIP.</p>
    </section>
    <form id="download-form" action="/api/kit-download" method="post" hidden>
      <input type="hidden" name="session_id" value="">
      <button class="button" type="submit">Download the test ZIP</button>
    </form>
    <noscript><p>Turn on JavaScript and reload this page so we can read your checkout reference.</p></noscript>
    <p class="checkout-footnote"><a href="/checkout/preview">Back to test checkout</a></p>
  </main>
</body>
</html>
