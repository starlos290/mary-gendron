<!DOCTYPE html><html lang="en"><meta charset="utf-8"><title>Viewport QA</title><meta name="robots" content="noindex"><style>body{margin:15px;font:15px system-ui;background:#dadada}pre{white-space:pre-wrap}iframe{border:1px solid #777;background:white;height:750px;display:block;max-width:none}select,button{font:inherit;padding:5px}header{margin-bottom:10px}</style>
<header><label>Viewport <select id="size"><option>390</option><option>320</option><option>740</option><option>768</option><option>1024</option><option>1366</option></select></label> <label>Page <select id="route"><option value="/">Homepage</option><option value="/hr-kits/handbook">Handbook</option><option value="/hr-kits/payroll">Payroll</option><option value="/hr-kits/california">California</option><option value="/hr-kits/bundle">Bundle</option></select></label> <button id="test">Check all sizes</button></header><pre id="log" aria-live="polite">Loading site</pre><iframe title="Storefront viewport" id="screen"></iframe><div id="runner"></div><script>
const frame=document.querySelector('#screen'),sel=document.querySelector('#size'),route=document.querySelector('#route'),log=document.querySelector('#log');
function load(){frame.style.width=sel.value+'px';frame.src=route.value}sel.onchange=route.onchange=load;frame.onload=()=>{if(!document.querySelector('#test').disabled)log.textContent='Viewing '+route.value+' at '+sel.value+' px'};load();
document.querySelector('#test').onclick=async function(){this.disabled=true;const summary=[];let checks=0;
 for(const href of [...route.options].map(o=>o.value)){
 const probe=document.createElement('iframe');probe.title='Audit';probe.style.cssText='position:absolute;left:-9999px;width:390px;height:770px;';const loaded=new Promise(res=>probe.onload=res);probe.src=href;document.querySelector('#runner').append(probe);await loaded;const page=probe.contentDocument;await page.fonts.ready;
 for(const width of [...sel.options].map(o=>Number(o.value))){probe.style.width=width+'px';await new Promise(res=>requestAnimationFrame(()=>requestAnimationFrame(res)));const w=page.documentElement.clientWidth,sw=page.documentElement.scrollWidth;if(sw>w+1)summary.push(href+' '+width+' overflows by '+(sw-w)+'px');checks++;
 if(!page.querySelector('h1')||!page.querySelector('.mast'))summary.push(href+' missing page content');}
 if(href==='/'){page.querySelector('#tab-case-handbook').click();if(page.querySelector('#case-handbook').hidden)summary.push('Handbook switch failed');page.querySelector('#case-handbook summary').click();if(!page.querySelector('#case-handbook details').open)summary.push('Annotation failed');page.querySelector('.magnifier').click();if(!page.querySelector('.photo-frame').classList.contains('is-zoomed'))summary.push('Lens failed');}
 probe.remove();}
 log.textContent='Finished '+checks+' viewport checks. '+(summary.length?summary.join('; '):'All passed.');this.disabled=false;};</script></html>
